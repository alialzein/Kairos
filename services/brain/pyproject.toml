[project]
name = "twin-brain"
version = "0.0.1"
description = "TWIN brain: orchestrator (Reasoner + Style Engine + memory)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15",
  "prometheus-client>=0.26",
  "pyjwt[crypto]>=2.13",
  "opentelemetry-api>=1.44",
  "opentelemetry-sdk>=1.44",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "ruff>=0.16",
  "mypy>=2.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brain"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pydantic-mypy]
init_typed = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
